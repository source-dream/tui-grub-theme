name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y shellcheck libxml2-utils file jq
      - name: Validate repository
        run: ./scripts/check.sh && ./scripts/check-ventoy.sh
